name: stacko_tower
description: "StackoTower - stack falling blocks and build the tallest tower!"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.37.0
  flame_forge2d: ^0.19.2+6
  video_player: ^2.9.3
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  audioplayers: ^6.6.0
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.11.0
  # Gray flow dependencies
  appsflyer_sdk: ^6.15.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.4
  http: ^1.3.0
  device_info_plus: ^11.3.3
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  file_picker: ^11.0.2
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/stacko_icon.webp
    - assets/stacko_name.webp
    - assets/gameplay/
    - assets/splash/
    - assets/additional_assets/notifications/
    - assets/additional_assets/no_wifi/
    - assets/music/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/stacko_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/stacko_icon.png"
